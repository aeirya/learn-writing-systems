name: Vendor Armenian handwriting images
on:
  push:
    branches: [master]
    paths: [armenian/download_images.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 armenian/download_images.py
      - name: Commit original SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add armenian/images/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor original Armenian handwriting SVGs"
            git push
          fi
